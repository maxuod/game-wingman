name: Desktop checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: Build unsigned development artifacts (no game validation)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package on explicit workflow dispatch only
        if: github.event_name == 'workflow_dispatch' && inputs.package
        run: npm run package:${{ matrix.target }}
      - name: Upload unsigned development artifact
        if: github.event_name == 'workflow_dispatch' && inputs.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: game-wingman-${{ matrix.target }}-unsigned
          path: release/
          retention-days: 7
          if-no-files-found: error
